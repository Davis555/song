<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HJD音乐</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top-full-banner">
  <div class="logo-top">
    <img src="image/hdj.png" alt="HJD音乐">
    <span>HJD音乐</span>
  </div>
</div>

<div class="page-wrap">
  <aside class="left-side">
    <div class="album-wrap" id="albumWrap"></div>
  </aside>

  <div class="middle-lyrics">
    <div class="song-bg" id="songBg">
      <!-- 中间旋转黑胶LOGO -->
      <img src="image/hdj.png" class="vinyl-disc" id="vinylDisc">
      <div class="song-bg-lyrics" id="songBgLyrics"></div>
    </div>

    <div class="lyrics-box">
      <div class="lyrics-text" id="lyricsText">欢迎使用HJD音乐播放器</div>
    </div>

    <div class="player-bar">
      <button class="btn" id="prevBtn">⏮</button>
      <button class="btn" id="playBtn">▶</button>
      <button class="btn" id="nextBtn">⏭</button>
      <input type="range" class="progress" id="progress" value="0">
      <div class="time" id="timeText">00:00 / 00:00</div>
      <div class="volume-group">
        <input type="range" id="volume" min="0" max="100" value="100">
        <div id="volumeText">100%</div>
      </div>
      <button class="download-btn" id="downloadBtn">下载</button>
    </div>
  </div>

  <aside class="right-side">
    <div class="right-card">
      <h3>关于作者</h3>
      <p>HJD音乐，专注Fusion/轻音乐创作</p>
    </div>
    <div class="right-card">
      <h3>最新动态</h3>
      <p>新增单曲《AnOtherWay》</p>
    </div>
  </aside>
</div>

<audio id="audio"></audio>
<script src="script.js"></script>
</body>
</html>
